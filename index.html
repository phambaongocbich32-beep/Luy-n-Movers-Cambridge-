grammar:{title:'So sánh hơn và so sánh nhất',intro:'So sánh hơn: <b>hai</b> đối tượng (than). So sánh nhất: <b>từ ba trở lên</b> (the …est).',
points:[
{h:'1. Tính từ ngắn (1 âm tiết)',body:'Hơn: <b>adj + -er + than</b>. Nhất: <b>the + adj + -est</b>.<br>tall → taller → the tallest · fast → faster → the fastest · old → older → the oldest.',ex:[['My sister is taller than me.','Chị cao hơn mình.'],['Peter is the shortest in his class.','Peter thấp nhất lớp.']]},
{h:'2. Quy tắc chính tả',body:'• Tận cùng <b>e</b>: chỉ thêm r/st → large → larger → the largest; late → later → the latest.<br>• <b>1 nguyên âm + 1 phụ âm</b>: gấp đôi phụ âm → thin → <b>thinner</b> → the <b>thinnest</b>; big → bigger; hot → hotter; sad → saddest.<br>• <b>Phụ âm + y</b>: y → i → happy → <b>happier</b> → the <b>happiest</b>; tidy → tidier → tidiest; dry → drier → driest; pretty → prettier → prettiest.',ex:[['Kate is the prettiest girl.','pretty → prettiest.'],['I have had the happiest days.','happy → happiest.']]},
{h:'3. Tính từ dài (2+ âm tiết)',body:'Hơn: <b>more + adj + than</b>. Nhất: <b>the most + adj</b>.<br>beautiful → more beautiful → the most beautiful; expensive, popular, comfortable, generous, handsome, dangerous. Tận cùng <b>-ow, -er, -le</b> có thể dùng -er: narrow → narrower, clever → cleverer.',ex:[['This dress is the most expensive in the shop.','expensive dài → the most.'],['Alice is more beautiful than her sister.','beautiful dài → more.']]},
{h:'4. Bất quy tắc',body:'good → <b>better</b> → the <b>best</b> · bad → <b>worse</b> → the <b>worst</b> · far → <b>farther/further</b> → the <b>farthest/furthest</b> · little → less → the least · many/much → more → the most.',ex:[['My cat is better than your dog.','good → better.']]},
{h:'5. Hai lỗi “kinh điển”',body:'• <b>Không dùng đôi</b>: more taller ✗ → taller ✓; the most tallest ✗ → the tallest ✓.<br>• So sánh nhất <b>bắt buộc có the</b>: Tom is <b>the</b> tallest. So sánh hơn thường có <b>than</b>.<br>Dấu hiệu: <i>than</i> → hơn; <i>in the class / of all / one of the …</i> → nhất.',ex:[['He is one of the most popular singers.','one of the + so sánh nhất + danh từ số nhiều.']]}],
mistakes:[['more taller','taller','Tính từ ngắn không dùng more.'],['the most tall','the tallest','Tính từ ngắn dùng -est.'],['happyer','happier','y → i + er.'],['thiner','thinner','gấp đôi n.'],['This is the more expensive.','This is the most expensive.','Nhất → the most.']]},

G1.lessons.push({n:9,icon:'🧭',title:'Can · May · Should',vi:'Động từ khuyết thiếu: khả năng, xin phép, lời khuyên',pages:'tr. 102–112',

vocab:[V('take a rest','v','nghỉ ngơi','He should take a rest.','🛌'),V('smoke','v','hút thuốc','You may not smoke here.','🚭'),V('ask a question','v','hỏi một câu','May I ask a question?','🙋'),V('borrow','v','mượn','May I borrow your pencil?','✏️'),V('go out','v','ra ngoài','May I go out?','🚪'),V('ride a bike','v','đi xe đạp','Mark can ride a bike.','🚲'),V('hit the ball','v','đánh bóng','Mary can hit the ball.','🏏'),V('count','v','đếm','He can\'t count to 10.','🔢'),V('arrive','v','đến nơi','He may arrive late.','🛬'),V('close the door','v','đóng cửa','Should I close the door?','🚪'),V('explain','v','giải thích','Can you explain the rules?','🗣️'),V('teach','v','dạy','Can you teach me?','🧑‍🏫'),V('wear a coat','v','mặc áo khoác','I should wear a coat.','🧥'),V('see a doctor','v','đi khám bác sĩ','You should see a doctor.','🧑‍⚕️'),V('fruit','n','trái cây','Children should eat fruit.','🍇'),V('candy','n','kẹo','Don\'t eat too many candies.','🍬')],
grammar:{title:'Can – May – Should',intro:'Ba động từ khuyết thiếu giống nhau về <b>cấu trúc</b>: động từ sau chúng luôn ở <b>nguyên mẫu không to</b>.',
points:[
{h:'1. Cấu trúc chung',body:'<b>S + can/may/should + V (nguyên mẫu)</b> · Phủ định: <b>can\'t / cannot</b>, <b>may not</b>, <b>shouldn\'t</b> · Nghi vấn: <b>Can/May/Should + S + V?</b><br>Không thêm -s với he/she/it, không thêm to, không thêm -ing.',ex:[['Mark can ride a bike.','Mark biết đi xe đạp.'],['He should take a rest.','Anh ấy nên nghỉ ngơi.'],['She shouldn\'t eat a lot of candies.','Cô bé không nên ăn nhiều kẹo.']]},
{h:'2. Can = có thể / biết',body:'Khả năng: <i>He can swim.</i> · Phủ định: <i>My younger brother <b>can\'t</b> count to 10.</i> · Xin phép thân mật: <i>Can I go out?</i> · Nhờ vả: <i>Can you help me?</i>',ex:[['Can you teach me how to play the guitar?','Bạn dạy mình chơi ghi-ta được không?']]},
{h:'3. May = xin phép lịch sự / có lẽ',body:'Xin phép lịch sự: <b>May I …?</b> (trang trọng hơn can). Cấm: <b>You may not …</b>. Phỏng đoán: <i>He may come late</i> (có lẽ).',ex:[['May I ask you a question?','Cho phép mình hỏi một câu?'],['You may not smoke here.','Bạn không được hút thuốc ở đây.']]},
{h:'4. Should = nên',body:'Lời khuyên: <b>should</b> (nên) / <b>shouldn\'t</b> (không nên). Hỏi ý kiến: <b>Should I close the door?</b>',ex:[['Children should eat a lot of fruit.','Trẻ em nên ăn nhiều trái cây.'],['You should see a doctor.','Bạn nên đi khám bác sĩ.']]},
{h:'5. Sắp xếp từ thành câu – mẹo',body:'Thứ tự: <b>(Từ để hỏi) + modal + S + V + tân ngữ</b>. Câu hỏi: <b>Modal + S + V …?</b> (May I ask…?). Câu thường: <b>S + modal + V …</b>.',ex:[['may / ask / I / you / a question → May I ask you a question?','Câu hỏi: modal đứng đầu.']]},
{h:'6. Các lỗi hay gặp khi sửa bài',body:'• <i>Should I closes</i> → <b>close</b> (V nguyên mẫu).<br>• <i>Am I borrow</i> → <b>May/Can I borrow</b>.<br>• <i>should wearing</i> → <b>should wear</b>.<br>• <i>Can your help</i> → <b>Can you help</b> (đại từ chủ ngữ).<br>• <i>mayn\'t</i> → <b>may not</b> (không viết tắt).<br>• <i>an doctor</i> → <b>a doctor</b>.',ex:[['Can you teach me…? (không phải teaches)','Sau modal: V nguyên mẫu.']]}],
mistakes:[['He cans swim.','He can swim.','can không thêm s.'],['She should to go.','She should go.','Không có to sau modal.'],['Can he plays?','Can he play?','Sau can dùng V nguyên mẫu.'],['They mayn\'t come.','They may not come.','may not không viết mayn\'t.']]},

fb('1. you / not / here. / may / smoke',['you may not smoke here'],'S + may not + V: <b>You may not smoke here.</b>',{'you not may smoke here':'may đứng trước not.','you may smoke not here':'not đứng sau may.'}),

EX('Exercise 10 — Correct the underlined mistakes','Sách tr.112','Tìm từ gạch chân sai rồi gõ lại từ đúng. Quy tắc: sau modal là động từ nguyên mẫu; chú ý đại từ và mạo từ.',[

fb('2. Am I borrow your pencil? → thay “Am” bằng:',['may','can'],'Xin phép: <b>May/Can I borrow…?</b> Am I là câu hỏi của to be.',{'should':'should là hỏi lời khuyên, ở đây là xin phép.'}),
fb('3. I should wearing a coat today. → từ đúng thay cho “wearing”:','wear','Sau should: V nguyên mẫu <b>wear</b>.',{'wore':'Sau modal không dùng quá khứ.','wears':'Sau modal không thêm s.'}),

G2.lessons.push({n:10,icon:'📍',title:'Prepositions of Time & Place',vi:'Giới từ chỉ thời gian và vị trí',pages:'khoảng tr. 7–20',
howto:['Học giới từ thời gian theo “kích thước”: at (điểm giờ) → on (ngày) → in (khoảng dài: tháng/mùa/năm).','Học giới từ nơi chốn: at (điểm), on (bề mặt), in (bên trong).','Học nhóm vị trí: in front of, behind, between, next to, under, near…','Làm bài Exercise 7 và 11 trong sách.','Đọc phần giải thích để biết vì sao chọn at/on/in.'],
vocab:[V('at 5 o\'clock','phr','lúc 5 giờ','The meeting starts at 7 a.m.','🕔'),V('at night / at noon','phr','vào ban đêm / buổi trưa','See you at noon.','🌙'),V('on Monday','phr','vào thứ Hai','We swim on Sundays.','📅'),V('on 15 April','phr','vào ngày 15/4','My birthday is on 15 April.','🗓️'),V('in July','phr','vào tháng 7','It\'s often rainy in July.','🌧️'),V('in the morning','phr','vào buổi sáng','I study in the morning.','🌅'),V('in 2015','phr','vào năm 2015','Mary was born in 2015.','🎂'),V('at the station','phr','ở nhà ga','Mom is waiting at the station.','🚉'),V('on the wall','phr','ở trên tường','The picture is on the wall.','🖼️'),V('in a car','phr','ở trong xe','Four people in a car.','🚗'),V('between … and …','prep','ở giữa … và …','The café is between the bookstore and the library.','↔️'),V('in front of','prep','phía trước','She stands in front of the school.','🔜'),V('behind','prep','phía sau','The park is behind the school.','🔙'),V('next to','prep','bên cạnh','The bank is next to the café.','🏦'),V('from … to …','prep','từ … đến …','The meeting lasts from 7 a.m. to 5 p.m.','⏱️'),V('moment','n','khoảnh khắc','at the moment','⌛')],
grammar:{title:'Giới từ chỉ thời gian và vị trí',intro:'Ba giới từ <b>at – on – in</b> xuất hiện cực nhiều. Cách nhớ: <b>at</b> = một điểm nhỏ · <b>on</b> = bề mặt/ngày cụ thể · <b>in</b> = khoảng rộng/bên trong.',
points:[
{h:'1. Chỉ thời gian: at – on – in',body:'<table class="mini"><tr><th>at</th><th>on</th><th>in</th></tr><tr><td>giờ: at 5 o\'clock, at 11:45<br>at noon / night / midnight<br>at Christmas, at the weekend</td><td>thứ: on Monday<br>ngày: on 15 April, on my birthday<br>buổi của ngày cụ thể: on Friday morning</td><td>tháng: in July<br>mùa: in winter<br>năm: in 2015<br>buổi: in the morning/afternoon/evening</td></tr></table>',ex:[['The bus leaves at 7 o\'clock.','at + giờ.'],['We go swimming on Sundays.','on + thứ.'],['It\'s often rainy in July.','in + tháng.']]},
{h:'2. Chỉ nơi chốn: at – on – in',body:'<b>at</b>: điểm cụ thể (at school, at the station, at 21 Oxford Street, at the Marriott Hotel).<br><b>on</b>: trên bề mặt/tầng/phố (on the table, on the wall, on the 4th floor, on the beach, on the phone).<br><b>in</b>: bên trong/thành phố/nước (in a car, in the library, in Japan, in London).',ex:[['The picture is on the wall.','Bề mặt.'],['Do you live in Japan?','Quốc gia.'],['We are staying at the Marriott Hotel.','Điểm cụ thể.']]},
{h:'3. Giới từ vị trí khác',body:'<b>in front of</b> (trước) · <b>behind</b> (sau) · <b>next to / beside</b> (cạnh) · <b>between A and B</b> (giữa A và B) · <b>under</b> (dưới) · <b>over/above</b> (trên) · <b>near</b> (gần) · <b>opposite</b> (đối diện).',ex:[['The café is between the bookstore and the library.','between … and …']]},
{h:'4. Từ … đến …',body:'<b>from … to …</b> (hoặc from … until …): <i>from 7 a.m. to 5 p.m.</i>',ex:[['The meeting lasts from 7 a.m. to 5 p.m.','Khoảng thời gian.']]},
{h:'5. Khi KHÔNG dùng giới từ',body:'Không dùng at/on/in trước <b>every, last, next, this, today, tomorrow, yesterday</b>: <i>every Sunday, last Sunday, next week, yesterday evening</i>. (Nhưng <i>in the evening</i> có “the” thì dùng in.)',ex:[['Harry goes swimming every Sunday.','Không có on.'],['I went swimming last Sunday.','Không có on.']]},
{h:'6. Cụm cố định hay gặp',body:'at home, at school, at work, at the moment · on the phone, on TV, on the left/right, on foot · in bed, in hospital, in a car, in the picture · at night nhưng <b>in</b> the morning.',ex:[['My father is on the phone right now.','on the phone.']]}],
mistakes:[['on 7 o\'clock','at 7 o\'clock','Giờ → at.'],['at Monday','on Monday','Thứ → on.'],['in Sunday morning','on Sunday morning','Buổi của một ngày cụ thể → on.'],['on every Sunday','every Sunday','Trước every không dùng giới từ.'],['Mary and her family live on Japan.','Mary and her family live in Japan.','Quốc gia → in.']]},

G2.lessons.push({n:11,icon:'🔁',title:'Present Simple Tense',vi:'Thì hiện tại đơn',pages:'khoảng tr. 23–34',

grammar:{title:'Thì hiện tại đơn (Present Simple)',intro:'Dùng cho <b>thói quen, sự thật hiển nhiên, lịch trình, sở thích</b>. Có hai kiểu câu: với <b>to be</b> và với <b>động từ thường</b>.',
points:[
{h:'1. Với động từ to be (am / is / are)',body:'I <b>am</b> · he/she/it <b>is</b> · you/we/they <b>are</b>. Rút gọn: I\'m, he\'s, she\'s, it\'s, you\'re, we\'re, they\'re. Phủ định: thêm <b>not</b> (isn\'t, aren\'t, am not). Nghi vấn: đảo to be lên đầu: <b>Is he …? Are they …?</b>',ex:[['He is usually relaxed.','Anh ấy thường thư thái.'],['They are not coming today.','Hôm nay họ không đến.'],['Are they married?','Họ kết hôn chưa?']]},
{h:'2. Với động từ thường',body:'Khẳng định: I/you/we/they + <b>V</b> · he/she/it + <b>V-s/-es</b>.<br>Phủ định: <b>don\'t</b> (I/you/we/they) · <b>doesn\'t</b> (he/she/it) + <b>V nguyên mẫu</b>.<br>Nghi vấn: <b>Do / Does</b> + S + <b>V nguyên mẫu</b>?<br>Trả lời ngắn: Yes, he does. / No, he doesn\'t.',ex:[['We paint in our free time.','We + V.'],['It doesn\'t hop around the garden.','doesn\'t + V nguyên mẫu.'],['Does he work downtown?','Does + V nguyên mẫu.']]},
{h:'3. Quy tắc thêm -s / -es / -ies',body:'Thường: + <b>s</b> (work → works). Tận cùng <b>s, x, z, ch, sh, o</b>: + <b>es</b> (watch → watches, go → goes, do → does, fix → fixes). <b>Phụ âm + y</b>: y → <b>ies</b> (study → studies). Nguyên âm + y: + s (play → plays). Đặc biệt: <b>have → has</b>.',ex:[['She studies for hours.','study → studies.'],['He goes to school.','go → goes.']]},
{h:'4. Trạng từ tần suất & vị trí',body:'always (100%) &gt; usually &gt; often &gt; sometimes &gt; never (0%). Đứng <b>trước động từ thường</b>, <b>sau to be</b>: <i>I always do yoga. · She is often busy.</i>',ex:[['She is often busy.','Sau to be.'],['They usually go to school by bus.','Trước động từ thường.']]},
{h:'5. Quy tắc vàng khi làm bài',body:'(1) Trong câu có <b>is/am/are</b> → dùng to be. (2) Câu có <b>do/does/don\'t/doesn\'t</b> → động từ chính luôn <b>nguyên mẫu</b>. (3) Chủ ngữ <b>it/he/she/tên một người</b> → thêm s/es.',ex:[['It doesn\'t hop. (không phải hops)','Sau doesn\'t: V nguyên mẫu.']]}],
mistakes:[['She go to school.','She goes to school.','he/she/it thêm -es.'],['He doesn\'t works.','He doesn\'t work.','Sau doesn\'t: V nguyên mẫu.'],['Do she like pizza?','Does she like pizza?','she → Does.'],['They is happy.','They are happy.','They → are.']]},
exercises:[
EX('Exercise 3 — Circle the correct answers (to be)','Sách tr.26','Chủ ngữ nào thì to be đó: I am · he/she/it is · you/we/they are.',[
mc('1. He ___ usually relaxed.',['am','is','are'],1,'he → <b>is</b>.',['am chỉ dùng với I.',null,'are dùng với you/we/they.']),
mc('2. She ___ often busy.',['am','is','are'],1,'she → <b>is</b>.',['am chỉ dùng với I.',null,'are dùng với you/we/they.']),
mc('3. They ___ coming today. (phủ định)',['am not','is not','are not'],2,'They → <b>are not</b> (aren\'t).',['am not chỉ dùng với I.','is not dùng với he/she/it.',null])]),
EX('Exercise 11 — Circle the correct answers','Sách tr.33','Quan sát chủ ngữ và loại câu: có to be hay động từ thường?',[
mc('1. It ___ hop around the garden.',["don't","doesn't",'am not','is not'],1,'it + động từ thường → <b>doesn\'t</b> hop.',["don't dùng với I/you/we/they.",null,'am not là to be (chỉ I).','is not + hop sai: hop là động từ thường.']),
mc('2. ___ it hot outside?',['Is','Do','Does','Are'],0,'hot là tính từ → dùng to be: <b>Is it hot outside?</b>',[null,'Do + V (động từ thường).','Does + V (động từ thường).','Are dùng với you/we/they.']),
mc('3. We ___ in our free time.',['paints','painting','paint','paintes'],2,'We → V nguyên mẫu <b>paint</b>.',['paints dùng với he/she/it.','painting cần có to be.',null,'paintes không tồn tại.']),
mc('4. ___ they married?',['Is','Do','Does','Are'],3,'married là tính từ → to be; they → <b>Are</b>.',['Is dùng với he/she/it.','Do cần động từ thường.','Does cần động từ thường.',null])]),
EX('Luyện thêm — Present Simple','Bài soạn thêm','Đầu tiên xác định chủ ngữ rồi xem có động từ thường không.',[
mc('She ___ to school by bike every day.',['go','goes','going'],1,'she → <b>goes</b>.',['go dùng với I/you/we/they.',null,'going cần to be.']),
mc('He ___ study on Saturday.',["don't","doesn't","isn't"],1,'he + động từ thường → <b>doesn\'t</b>.',["don't dùng với I/you/we/they.",null,"isn't dùng với to be."]),
mc('___ your sister like pizza?',['Do','Does','Is'],1,'your sister = she → <b>Does</b> … like?',['Do dùng với I/you/we/they.',null,'Is dùng với to be.']),
fb('My dad ___ (watch) TV in the evening.','watches','watch tận cùng ch → watches.',{'watchs':'ch → -es.','watch':'he/she/it cần -es.'}),
fb('She ___ (study) English every day.','studies','phụ âm + y → ies.',{'studys':'y → ies.'}),
fb('They ___ (not / like) fish.',["don't like",'do not like'],"They → don't like.",{"doesn't like":"They → don't."}),
mc('She is ___ late for school.',['never','never is','is never'],0,'Trạng từ tần suất đứng sau to be: She is <b>never</b> late.',[null,'Sai vị trí.','Sai vị trí.'])],false)]});

G2.lessons.push({n:12,icon:'🎬',title:'Present Continuous Tense',vi:'Thì hiện tại tiếp diễn',pages:'khoảng tr. 39–48',
howto:['Nhớ công thức: am/is/are + V-ing.','Học quy tắc thêm -ing (bỏ e, gấp đôi phụ âm, ie → ying).','Phân biệt với hiện tại đơn: đang xảy ra (now) hay thói quen (usually)?','Nhớ động từ trạng thái không chia tiếp diễn: know, like, love, want…','Làm Exercise 12, 8, 10 rồi xem lời giải.'],
vocab:[V('write','v','viết','Tom is writing a letter.','✍️'),V('knit','v','đan (len)','She is knitting a scarf.','🧶'),V('exercise','v','tập thể dục','He is exercising in the gym.','🏋️'),V('practise','v','luyện tập','They are practising.','🎯'),V('clean','v','lau dọn','He is cleaning his car.','🧽'),V('attend','v','tham dự','We regularly attend church.','⛪'),V('leave','v','rời đi','They are leaving the room.','🚪'),V('travel','v','đi du lịch','They travel to different countries.','🌍'),V('stay up late','v','thức khuya','She seldom stays up late.','🌙'),V('buy groceries','v','mua đồ tạp hóa','We buy groceries on Saturdays.','🛒'),V('dance routine','n','bài nhảy','They practise their dance routine.','💃'),V('whiteboard','n','bảng trắng','The teacher writes on the whiteboard.','📋'),V('know','v','biết (không dùng -ing)','He knows what happened.','🧠'),V('right now','adv','ngay bây giờ','He is working right now.','⏱️'),V('at the moment','adv','vào lúc này','They are practising at the moment.','⌛')],
grammar:{title:'Thì hiện tại tiếp diễn',intro:'Diễn tả hành động <b>đang diễn ra ngay lúc nói</b> hoặc <b>quanh thời điểm hiện tại</b>.',
points:[
{h:'1. Cấu trúc',body:'(+) S + <b>am/is/are</b> + V-ing<br>(−) S + <b>am/is/are not</b> + V-ing<br>(?) <b>Am/Is/Are</b> + S + V-ing? → Yes, he is. / No, he isn\'t.',ex:[['He is cleaning his car.','Anh ấy đang rửa xe.'],['They are not working.','Họ đang không làm việc.'],['Is she knitting a scarf?','Cô ấy đang đan khăn à?']]},
{h:'2. Quy tắc thêm -ing',body:'• Thường: + ing (work → working)<br>• Tận cùng <b>e</b> (không phải ee): bỏ e + ing (write → writing, leave → leaving, make → making)<br>• <b>1 nguyên âm + 1 phụ âm</b>: gấp đôi (eat → eating KHÔNG gấp đôi vì có 2 nguyên âm ea; but sit → sitting, run → running, swim → swimming, stop → stopping)<br>• <b>ie</b> → <b>ying</b> (lie → lying, die → dying)',ex:[['They are leaving the room.','leave → leaving.'],['Tom is eating snacks.','eat → eating (không phải eatting).']]},
{h:'3. Dấu hiệu nhận biết',body:'<b>now, right now, at the moment, at present, today, these days</b>, và câu mệnh lệnh <b>Look! Listen! Be quiet!</b>',ex:[['Look! He is exercising in the gym.','Look! → đang xảy ra.']]},
{h:'4. Phân biệt với hiện tại đơn',body:'<b>Hiện tại đơn</b> (thói quen): <i>We regularly attend church on Sundays.</i> (regularly, usually, every…)<br><b>Hiện tại tiếp diễn</b> (đang xảy ra): <i>She is knitting a scarf now.</i><br>Hỏi: “Việc này lặp lại thường xuyên hay đang diễn ra?”',ex:[['He occasionally works from home. (đơn)','occasionally → thói quen.'],['The teacher is writing now. (tiếp diễn)','now → đang xảy ra.']]},
{h:'5. Động từ KHÔNG dùng tiếp diễn',body:'Chỉ trạng thái/cảm xúc/tri giác: <b>know, understand, like, love, hate, want, need, believe, see, hear, smell, belong</b>. Dùng hiện tại đơn: <i>He <b>knows</b> what happened.</i> (không phải is knowing). Cũng nói: I like pizza (không nói I am liking).',ex:[['He knows what happened.','know không chia tiếp diễn.']]},
{h:'6. Mẹo chọn đáp án nhanh',body:'Gặp <b>now / right now / at the moment / Look!</b> → am/is/are + V-ing. Gặp <b>every, always, usually, seldom, occasionally, regularly, frequently</b> → hiện tại đơn.',ex:[['She seldom stays up late.','seldom → đơn.']]}],
mistakes:[['He is knowing the answer.','He knows the answer.','know là động từ trạng thái.'],['Tom is eatting snacks.','Tom is eating snacks.','eat không gấp đôi t.'],['They is practicing.','They are practising.','They → are.'],['She is write a letter.','She is writing a letter.','Cần V-ing: writing.']]},

G2.lessons.push({n:13,icon:'⏪',title:'Past Simple Tense',vi:'Thì quá khứ đơn',pages:'khoảng tr. 52–62',
howto:['Học 3 dạng: to be (was/were), động từ có quy tắc (-ed), bất quy tắc (bảng động từ cuối sách).','Học quy tắc thêm -ed.','Nhớ khung câu phủ định/nghi vấn: did + V nguyên mẫu.','Làm Exercise 12 (sắp xếp) và Exercise 13 (trả lời).','Xem lời giải, ghi lỗi sai vào sổ.'],
vocab:[V('yesterday','adv','hôm qua','I watched TV yesterday.','📆'),V('last night','phr','tối qua','I didn\'t open the door last night.','🌃'),V('last week','phr','tuần trước','We went there last week.','🗓️'),V('ago','adv','cách đây','Two days ago.','⏳'),V('decorate','v','trang trí','We decorated the tree.','🎄'),V('invite','v','mời','Anna invited me.','💌'),V('audience','n','khán giả','The audience didn\'t know.','👥'),V('pine tree','n','cây thông','The pine tree is big.','🌲'),V('answer','n','câu trả lời','The answer is B.','✅'),V('strange','adj','kỳ lạ','Something strange happened.','👀'),V('happen','v','xảy ra','What happened?','💥'),V('holiday','n','kỳ nghỉ','Where did you go on holiday?','🏖️'),V('birthday party','n','tiệc sinh nhật','Come to my birthday party.','🎂'),V('walk down','v','đi dọc xuống','She walked down the street.','🚶'),V('send','v','gửi','Did you send me your email?','📧')],
grammar:{title:'Thì quá khứ đơn',intro:'Kể <b>việc đã xảy ra và kết thúc</b> ở một thời điểm trong quá khứ.',
points:[
{h:'1. Dấu hiệu',body:'<b>yesterday, last night/week/month/year, two days ago, in 2015, when I was a child, the other day</b>.',ex:[['My family decorated the tree last Christmas.','last Christmas.']]},
{h:'2. To be: was / were',body:'I/he/she/it → <b>was</b>; you/we/they → <b>were</b>. Phủ định: wasn\'t/weren\'t. Nghi vấn: Was he…? Were they…?',ex:[['It was very dirty yesterday.','Hôm qua nó rất bẩn.'],['Were you at home?','Bạn có ở nhà không?']]},
{h:'3. Động từ có quy tắc: + ed',body:'• Thường: + ed (walk → walked, play → played)<br>• Tận cùng e: + d (decorate → decorated, invite → invited)<br>• Phụ âm + y: y → ied (study → studied)<br>• 1 nguyên âm + 1 phụ âm: gấp đôi (stop → stopped, plan → planned)',ex:[['Anna invited me to her party.','invite + d.']]},
{h:'4. Động từ bất quy tắc',body:'Học thuộc bảng cuối sách: go → went, see → saw, eat → ate, have → had, buy → bought, take → took, send → sent, know → knew…',ex:[['I went to the zoo last week.','go → went.']]},
{h:'5. Phủ định & nghi vấn',body:'Phủ định: <b>S + didn\'t + V nguyên mẫu</b> (<i>I didn\'t open the door</i>).<br>Nghi vấn: <b>Did + S + V nguyên mẫu?</b> (<i>Did you send me your email?</i>)<br>Trả lời ngắn: <b>Yes, I did. / No, I didn\'t.</b> Hỏi Wh-: <b>Where did you go?</b>',ex:[['Did something strange happen last night?','Did + happen (nguyên mẫu).']]},
{h:'6. Trả lời câu hỏi Yes/No',body:'Câu hỏi bắt đầu bằng <b>Did</b> → trả lời bằng <b>did / didn\'t</b>. Bắt đầu bằng <b>Does</b> → <b>does / doesn\'t</b>. Đại từ trả lời: he/she/it/they… (dad → he, mom → she).',ex:[['Does your dad watch TV every night? – Yes, he does.','Does → does; dad → he.']]},
{h:'7. Cách sắp xếp từ',body:'Câu hỏi: <b>(Wh-) + did + S + V + …?</b> · Phủ định: <b>S + didn\'t + V</b> · Khẳng định: <b>S + V2 + …</b> + mốc thời gian cuối câu.',ex:[['Where did you go for your last holiday?','Wh- + did + S + V.']]}],
mistakes:[['I goed to school.','I went to school.','go bất quy tắc.'],['Did you went?','Did you go?','Sau Did: V nguyên mẫu.'],['She didn\'t visited.','She didn\'t visit.','Sau didn\'t: V nguyên mẫu.'],['Yes, he doesn\'t.','Yes, he does.','Yes đi với dạng khẳng định.']]},

EX('Exercise 12 — Reorder the words (chọn lọc)','Sách tr.62','Xác định khung: câu hỏi Did…? phủ định didn\'t? khẳng định V2? Rồi sắp từ.',[
fb('4. Lily / the street / walk / Did / her / down / parents? / with',['did lily walk down the street with her parents','did her parents walk down the street with lily'],'Câu hỏi: Did + S + V + … → <b>Did Lily walk down the street with her parents?</b> (hoặc Did her parents walk … with Lily?)',{'lily did walk down the street with her parents':'Câu hỏi: Did đứng đầu.'}),

fb("9. didn't / open / I / the door / last night.",["i didn't open the door last night"],"<b>I didn't open the door last night.</b>",{}),

EX('Exercise 13 — Circle the correct answers','Sách tr.62','Câu trả lời ngắn phải khớp trợ động từ của câu hỏi (did/does) và đại từ.',[
mc('1. Did you send me your email?',['Yes, I do.','No, I did.',"No, I didn't."],2,'Hỏi Did…? → trả lời bằng did/didn\'t. “No” đi với didn\'t.',['Yes, I do dùng cho câu hỏi Do you…?','No đi với didn\'t, không phải did.',null]),
mc('2. Does your dad watch TV every night?',['Yes, he does.',"No, she doesn't.","Yes, he doesn't."],0,'dad = he; Yes + does.',[null,'dad là he, không phải she.','Yes đi với does, không phải doesn\'t.'])]),
EX('Luyện thêm — Past Simple','Bài soạn thêm','Gạch chân mốc thời gian quá khứ rồi chọn động từ phù hợp.',[

G2.lessons.push({n:14,icon:'🌀',title:'Past Continuous Tense',vi:'Thì quá khứ tiếp diễn',pages:'khoảng tr. 66–72',

grammar:{title:'Thì quá khứ tiếp diễn',intro:'Nói về hành động <b>đang diễn ra tại một thời điểm trong quá khứ</b>, hoặc hành động kéo dài bị cắt ngang.',
points:[
{h:'1. Cấu trúc',body:'(+) S + <b>was/were</b> + V-ing<br>(−) S + <b>wasn\'t/weren\'t</b> + V-ing<br>(?) <b>Was/Were</b> + S + V-ing?<br>I/he/she/it → was · you/we/they → were.',ex:[['Anna was sleeping at two o\'clock.','Lúc 2 giờ Anna đang ngủ.'],['Were they watching a movie on TV?','Họ đang xem phim à?']]},
{h:'2. Dấu hiệu',body:'<b>at + giờ + yesterday/last night</b> (at four o\'clock yesterday), <b>while</b>, <b>when</b>, <b>all day yesterday</b>.',ex:[['At four o\'clock, I was hanging out with my friends.','Lúc 4 giờ mình đang đi chơi.']]},
{h:'3. While – When',body:'<b>While + quá khứ tiếp diễn</b> (hành động dài): <i>While I was studying, my mother was cooking.</i><br><b>When + quá khứ đơn</b> (hành động ngắn cắt ngang): <i>He was reading a book when the phone rang.</i><br>Hai hành động song song cùng lúc: dùng 2 QKTD với while.',ex:[['I fell asleep while I was reading a book.','Đang đọc thì ngủ thiếp.'],['John was listening to music while his father was watching TV.','Hai hành động song song.']]},
{h:'4. Quy tắc thêm -ing',body:'Giống hiện tại tiếp diễn: bỏ e (hang → hanging, leave → leaving), gấp đôi phụ âm (run → running, swim → swimming), ie → ying.',ex:[['The baby was crawling.','crawl + ing.']]},
{h:'5. Phân biệt QKĐ và QKTD',body:'<b>QKĐ</b>: việc đã xong (<i>I read a book yesterday.</i>). <b>QKTD</b>: việc đang diễn ra lúc đó (<i>I was reading a book at 8.</i>).',ex:[['She was cooking when I came.','Đang nấu thì tôi đến.']]},
{h:'6. Mẹo chọn was hay were',body:'Nhìn chủ ngữ: <b>The sun</b> → was · <b>The flowers</b> → were · <b>The baby</b> → was · <b>They</b> → were · <b>I</b> → was.',ex:[['The flowers were blooming.','flowers số nhiều → were.']]}],

G2.lessons.push({n:15,icon:'⏭️',title:'Future Simple Tense',vi:'Thì tương lai đơn (will)',pages:'khoảng tr. 76–84',
howto:['Công thức: will + V nguyên mẫu (mọi ngôi).','Dấu hiệu: tomorrow, next week, in 2030, soon, later.','So sánh 3 thì: quá khứ, hiện tại, tương lai.','Làm Exercise 9 (chọn thì đúng) và 10.','Luyện thêm.'],
vocab:[V('tomorrow','adv','ngày mai','I will play tomorrow.','🌄'),V('next week','phr','tuần sau','She will draw next week.','🗓️'),V('next month','phr','tháng sau','They will run a marathon next month.','🏃'),V('later','adv','lát nữa','We will watch a movie later.','🕒'),V('soon','adv','sớm thôi','He will come soon.','🔜'),V('recital','n','buổi biểu diễn','A dance recital.','💃'),V('marathon','n','cuộc chạy marathon','They will run a marathon.','🏅'),V('draw a picture','v','vẽ tranh','She will draw a picture.','🖍️'),V('rise','v','mọc','The sun rises in the morning.','🌅'),V('be born','v','được sinh ra','I was born in 1991.','👶'),V('theater','n','rạp hát','A movie at the theater.','🎭'),V('probably','adv','có lẽ','It will probably rain.','☁️'),V('I think','phr','mình nghĩ','I think she will win.','💭'),V('promise','v','hứa','I promise I will help.','🤞'),V('perhaps','adv','có thể','Perhaps he will come.','🤷')],
grammar:{title:'Tương lai đơn với will',intro:'Dùng cho <b>dự đoán, quyết định tức thì, lời hứa, đề nghị, dự định chưa chắc chắn</b>.',
points:[
{h:'1. Cấu trúc',body:'(+) S + <b>will</b> + V nguyên mẫu (I\'ll, she\'ll, they\'ll…)<br>(−) S + <b>will not = won\'t</b> + V<br>(?) <b>Will</b> + S + V? → Yes, she will. / No, she won\'t.<br>will dùng cho <b>mọi chủ ngữ</b>, không thêm -s.',ex:[['She will draw a picture next week.','Tuần sau cô ấy sẽ vẽ tranh.'],['They won\'t come.','Họ sẽ không đến.'],['Will she have a dance recital next month?','Cô ấy sẽ có buổi biểu diễn tháng sau?']]},
{h:'2. Dấu hiệu',body:'<b>tomorrow, next week/month/year, in 2030, soon, later, tonight, in the future</b>, và các cụm <b>I think / I\'m sure / perhaps / probably</b>.',ex:[['I will play with my friends tomorrow.','tomorrow.']]},
{h:'3. Cách dùng',body:'• Dự đoán: <i>I think it will rain.</i><br>• Quyết định tức thì: <i>I\'m thirsty. I\'ll get some water.</i><br>• Lời hứa: <i>I will help you.</i><br>• Đề nghị: <i>I\'ll carry your bag.</i>',ex:[['We will watch a movie at the theater later.','Kế hoạch trong tương lai.']]},
{h:'4. Phân biệt 3 thì trong bài',body:'<b>Quá khứ đơn</b>: last night, yesterday, in 1991 (<i>was born, played</i>).<br><b>Hiện tại đơn</b>: every evening, in the morning, thói quen/sự thật (<i>cook, rises</i>).<br><b>Tương lai đơn</b>: tomorrow, next week/month (<i>will play, will draw</i>).',ex:[['The sun rises in the morning. (sự thật → hiện tại đơn)','Sự thật hiển nhiên.'],['I was born in 1991. (năm trong quá khứ)','Quá khứ.']]},
{h:'5. Mẹo làm “Exercise: Circle the correct answers”',body:'Bước 1: gạch chân mốc thời gian. Bước 2: xác định thì. Bước 3: chọn dạng động từ: next month/tomorrow → <b>will + V</b>; yesterday/last night/năm cụ thể → <b>V2 / was</b>; every/in the morning/sự thật → <b>V(s)</b>.',ex:[['We listened to music at the party yesterday.','yesterday → V2.']]}],

G2.lessons.push({n:16,icon:'🎯',title:'Near Future Tense',vi:'Tương lai gần (be going to)',pages:'khoảng tr. 89–98',
howto:['Công thức: am/is/are + going to + V nguyên mẫu.','Nhớ khác biệt: be going to = kế hoạch đã định/ dấu hiệu rõ; will = quyết định tức thì/ dự đoán chung.','Làm Exercise 2 và 5.','Chú ý câu hỏi: Are they going to …?','Luyện thêm.'],

grammar:{title:'Tương lai gần với be going to',intro:'Dùng cho <b>kế hoạch/dự định</b> và <b>dự đoán có dấu hiệu rõ ở hiện tại</b>.',
points:[
{h:'1. Cấu trúc',body:'(+) S + <b>am/is/are going to</b> + V<br>(−) S + <b>am/is/are not going to</b> + V<br>(?) <b>Am/Is/Are</b> + S + <b>going to</b> + V?<br>I → am · he/she/it → is · you/we/they → are.',ex:[['My mom is going to cook dinner.','Mẹ sẽ nấu bữa tối.'],['They aren\'t going to do anything.','Họ sẽ không làm gì cả.'],['Are they going to decorate the house?','Họ định trang trí nhà à?']]},
{h:'2. Dạng bị động (tương lai gần)',body:'Trong sách có ví dụ: <i>The dogs are going to be fed by Tommy.</i> → <b>are going to be + V3</b> (đối tượng bị tác động là chủ ngữ).',ex:[['The dogs are going to be fed by Tommy.','Những chú chó sẽ được Tommy cho ăn.']]},
{h:'3. Be going to hay Will?',body:'<b>be going to</b>: kế hoạch đã có từ trước, hoặc <b>dấu hiệu rõ</b> (<i>Look at those clouds! It is going to rain.</i>).<br><b>will</b>: quyết định ngay lúc nói, lời hứa, dự đoán chung (<i>I think it will rain.</i>).',ex:[['We are going to learn about animals.','Kế hoạch bài học.']]},
{h:'4. Chú ý động từ go/come',body:'Với <b>go</b> và <b>come</b> thường dùng tiếp diễn: <i>I am going to the zoo.</i> (đi đến một nơi) ≠ <i>I am going to go to the zoo.</i> Cả hai đều đúng, nhưng tránh lặp “go to go” trong văn viết ngắn.',ex:[['Jim is going to play the video game.','going to + V.']]},
{h:'5. Mẹo làm bài',body:'(1) Tìm chủ ngữ để chọn am/is/are. (2) Sau <b>going to</b> luôn là V nguyên mẫu. (3) Câu hỏi: <b>Are we going to … ? Is she going to … ?</b> (4) Câu hỏi lựa chọn “X or Y?” vẫn giữ nguyên cấu trúc.',ex:[['Are we going to learn about animals or plants?','Câu hỏi lựa chọn.']]}],
mistakes:[['I going to swim.','I am going to swim.','Thiếu am.'],['She is going to goes.','She is going to go.','V nguyên mẫu.'],['They is going to travel.','They are going to travel.','They → are.'],['Does she going to cook?','Is she going to cook?','Dùng to be, không dùng does.']]},

{h:'2. Từ để hỏi (Wh-) và mục đích',body:'<b>What</b> → vật/thông tin · <b>Where</b> → nơi chốn · <b>When / What time</b> → thời gian · <b>Who</b> → người · <b>Whose</b> → sở hữu · <b>Which</b> → lựa chọn · <b>Why</b> → lý do · <b>How</b> → cách thức/tình trạng · <b>How old / many / much / long / often</b> → tuổi / số lượng / giá / thời lượng / tần suất.',ex:[['Who is playing the piano? (Person)','Hỏi người.'],['Where did you go last night? (Place)','Hỏi nơi chốn.']]},

{h:'4. Viết câu hỏi cho phần được gạch chân',body:'Bước 1: xác định phần gạch chân là gì (người, nơi chốn, thời gian, lý do…). Bước 2: chọn từ để hỏi. Bước 3: đảo trợ động từ. Ví dụ: She was born <u>in London</u>. → <b>Where</b> was she born?',ex:[['He works at a company downtown. → Where does he work?','Hỏi nơi chốn.']]},

{h:'2. Học theo nhóm cho dễ nhớ',body:'• <b>Cả 3 giống nhau</b>: put – put – put, cut, hit, read (đọc khác).<br>• <b>V2 = V3</b>: buy–bought–bought, bring–brought–brought, catch–caught, teach–taught, think–thought, make–made, say–said, tell–told, send–sent, meet–met, sleep–slept, leave–left, feel–felt, have–had.<br>• <b>Đổi nguyên âm</b>: sing–sang–sung, swim–swam–swum, drink–drank–drunk, begin–began–begun, run–ran–run, come–came–come.<br>• <b>V3 thêm -n / -en</b>: eat–ate–eaten, fall–fell–fallen, give–gave–given, take–took–taken, write–wrote–written, ride–rode–ridden, break–broke–broken, speak–spoke–spoken.',ex:[['She ate two sandwiches.','eat → ate.']]},

/* ===== Game ôn từ vựng & ngữ pháp (theo từng Unit / Lesson) ===== */
let gTimer=null;
const gLab=v=>String(v.w).split(' – ')[0].replace(/\(.*?\)/g,'').trim();
const gSpell=v=>/^[a-z]+$/i.test(gLab(v))&&gLab(v).length>=3&&gLab(v).length<=12;
const gVi=v=>String(v.vi).split('(')[0].trim();
function gSources(){
  const out=[];
  out.push({id:'all-u',grp:'Get Ready for Movers',label:'⭐ Tất cả 13 unit',vocab:UNITS.flatMap(u=>u.vocab),qs:UNITS.flatMap(u=>u.quiz)});
  UNITS.forEach(u=>out.push({id:'u'+u.id,grp:'Get Ready for Movers',label:`Unit ${u.id}: ${u.title}`,vocab:u.vocab,qs:u.quiz}));
  BOOKS.forEach(b=>{
    out.push({id:'all-'+b.id,grp:b.title,label:'⭐ Tất cả các bài',vocab:b.lessons.flatMap(l=>l.vocab),qs:b.lessons.flatMap(l=>l.exercises.flatMap(e=>e.qs))});
    b.lessons.forEach(l=>out.push({id:`${b.id}-${l.n}`,grp:b.title,label:`Lesson ${l.n}: ${l.title}`,vocab:l.vocab,qs:l.exercises.flatMap(e=>e.qs)}));
  });
  return out;
}
const GSRC=gSources();
const gBlank=q=>q.q&&/_{2,}/.test(q.q)&&Array.isArray(q.o);

const GAMES=[

/* ---------- hub ---------- */
function vGames(){
  clearInterval(gTimer);S.gm=S.gm||{};
  if(!st.gsrc||!GSRC.find(x=>x.id===st.gsrc))st.gsrc='u0';
  const src=GSRC.find(x=>x.id===st.gsrc);
  const groups=[...new Set(GSRC.map(x=>x.grp))];
  const stars=(g)=>{const b=S.gm[src.id+'|'+g];return b==null?'':' · '+'⭐'.repeat(b>=90?3:b>=60?2:1)+` ${b}%`};
  if(!st.gg){
    main().innerHTML=`<div class="pagehead"><h1>🎮 Góc trò chơi</h1><p>Chọn Unit / Lesson, rồi chọn trò chơi để ôn từ vựng và ngữ pháp. Điểm cao nhất được lưu lại.</p></div>
    <div class="card gsel"><label><b>Chọn bài ôn:</b> <select id="gsrc">${groups.map(g=>`<optgroup label="${esc(g)}">${GSRC.filter(x=>x.grp===g).map(x=>`<option value="${x.id}" ${x.id===src.id?'selected':''}>${esc(x.label)}</option>`).join('')}</optgroup>`).join('')}</select></label>
     <small class="muted">${src.vocab.length} từ vựng · ${src.qs.length} câu ngữ pháp</small></div>
    <h2 class="sec">🔤 Trò chơi từ vựng</h2><div class="ugrid">${GAMES.filter(g=>g.k==='v').map(g=>gCard(g,src,stars)).join('')}</div>
    <h2 class="sec">📘 Trò chơi ngữ pháp</h2><div class="ugrid">${GAMES.filter(g=>g.k==='g').map(g=>gCard(g,src,stars)).join('')}</div>
    <div class="card"><div id="vbar"></div></div>`;
    $('#gsrc').onchange=e=>{st.gsrc=e.target.value;vGames()};
    $$('[data-g]').forEach(a=>a.onclick=()=>{st.gg=a.dataset.g;vGames();window.scrollTo(0,0)});
    drawVoiceBar();return;
  }
  const g=GAMES.find(x=>x.id===st.gg);
  main().innerHTML=`<div class="pagehead"><h1>${g.icon} ${g.name}</h1><p>${esc(src.label)}</p><div class="btnrow"><button class="btn ghost sm" id="gback">◀ Chọn trò khác</button></div></div><div id="garea"></div>`;
  $('#gback').onclick=()=>{clearInterval(gTimer);st.gg=null;vGames();window.scrollTo(0,0)};
  const root=$('#garea');
  const fin=(pct,detail)=>{
    clearInterval(gTimer);const key=src.id+'|'+g.id;S.gm[key]=Math.max(S.gm[key]||0,pct);save();
    const n=pct>=90?3:pct>=60?2:1;
    root.innerHTML=`<div class="card gfin"><div class="gstars">${'⭐'.repeat(n)}${'☆'.repeat(3-n)}</div><h2>${pct>=90?'Tuyệt vời! 🎉':pct>=60?'Khá tốt! 👏':'Cố lên, thử lại nhé 💪'}</h2><p><b>${pct}%</b> ${detail||''}</p><p class="muted">Điểm cao nhất: ${S.gm[key]}%</p>
     <div class="btnrow c"><button class="btn" id="gagain">🔄 Chơi lại</button><button class="btn ghost" id="gother">Trò khác</button></div></div>`;
    $('#gagain').onclick=()=>vGames();$('#gother').onclick=()=>{st.gg=null;vGames();window.scrollTo(0,0)};
  };
  g.fn(root,src,fin);
}
function gCard(g,src,stars){
  const ok=g.need(src);
  return `<article class="ucard ${ok?'':'dis'}" style="--h:${(GAMES.indexOf(g)*37+10)%360}"><div class="uhead"><span class="uic">${g.icon}</span><span class="un">${g.k==='v'?'Từ vựng':'Ngữ pháp'}</span></div><h3>${g.name}</h3><p>${g.desc}</p><small>${ok?stars(g.id).replace(/^ · /,'')||'Chưa chơi':'Bài này chưa đủ dữ liệu cho trò này'}</small>${ok?`<div class="ulinks"><a data-g="${g.id}">Chơi ▶</a></div>`:''}</article>`;
}
const gHud=(lives,pts,i,n)=>`<div class="ghud"><span>${'❤️'.repeat(Math.max(0,lives))}${'🖤'.repeat(Math.max(0,3-lives))}</span><span>⭐ ${pts}</span><span>${Math.min(i+1,n)}/${n}</span></div>`;
function gDistract(v,pool,n,key){
  const ex=new Set([key(v)]);const out=[];
  shuffle(pool).concat(shuffle(ALLVOCAB)).forEach(x=>{if(out.length<n&&!ex.has(key(x))){ex.add(key(x));out.push(x)}});
  return out;
}

/* ---------- 1. Quiz nhanh ---------- */
function gQuiz(root,src,fin){
  const items=shuffle(src.vocab).slice(0,10);let i=0,lives=3,pts=0,ok=0,streak=0;
  function next(){
    clearInterval(gTimer);
    if(i>=items.length||lives<=0)return fin(Math.round(100*ok/items.length),`(${ok}/${items.length} câu đúng, ${pts} điểm)`);
    const v=items[i],dir=i%2;
    const d=gDistract(v,src.vocab,3,dir?gVi:gLab);const opts=shuffle([v,...d]);
    root.innerHTML=`<div class="card gq">${gHud(lives,pts,i,items.length)}<div class="gbar"><i id="tb"></i></div>
     ${dir?`<div class="gbig">${esc(gLab(v))} <button class="spk" data-say="${esc(gLab(v))}">🔊</button></div><p class="muted">Nghĩa tiếng Việt là gì?</p>`:`<div class="gbig em">${v.em}</div><p class="muted">Từ tiếng Anh là gì? <button class="spk" data-say="${esc(gLab(v))}">🔊</button></p>`}
     <div class="gopts">${opts.map((o,k)=>`<button class="gopt" data-k="${k}">${esc(dir?gVi(o):gLab(o))}</button>`).join('')}</div><div id="gfb"></div></div>`;
    let t=12000;const tb=$('#tb');
    const answer=k=>{
      clearInterval(gTimer);$$('.gopt',root).forEach((b,j)=>{b.disabled=true;if(opts[j]===v)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
      if(k>=0&&opts[k]===v){ok++;streak++;pts+=10+Math.min(streak,5)*2;say(gLab(v))}else{streak=0;lives--;$('#gfb').innerHTML=`<p class="badmsg">Đáp án: <b>${esc(dir?gVi(v):gLab(v))}</b> — ${esc(gVi(v))}</p>`}
      i++;setTimeout(next,k>=0&&opts[k]===v?700:1500);
    };
    $$('.gopt',root).forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    gTimer=setInterval(()=>{if(!document.body.contains(tb)){clearInterval(gTimer);return}t-=100;tb.style.width=(100*t/12000)+'%';if(t<=0)answer(-1)},100);
  }
  next();
}

/* ---------- 2. Nối cặp ---------- */
function gMatch(root,src,fin){
  const pairs=shuffle(src.vocab).slice(0,6);let mist=0,left=pairs.length,sel=null;
  const tiles=shuffle(pairs.flatMap((v,i)=>[{id:i,h:`<span class="te">${v.em}</span>`},{id:i,h:`<b>${esc(gLab(v))}</b>`}]));
  root.innerHTML=`<div class="card"><p class="muted">Bấm một hình rồi bấm từ tương ứng. Sai: <b id="gm">0</b></p><div class="gtiles">${tiles.map((t,k)=>`<button class="gtile" data-k="${k}">${t.h}</button>`).join('')}</div></div>`;
  $$('.gtile',root).forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done'))return;
    if(!sel){sel=b;b.classList.add('sel');return}
    if(sel===b){b.classList.remove('sel');sel=null;return}
    const A=tiles[+sel.dataset.k],B=tiles[+b.dataset.k];
    if(A.id===B.id&&A.h!==B.h){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');say(gLab(pairs[A.id]));left--;sel=null;if(!left)setTimeout(()=>fin(Math.round(100*pairs.length/(pairs.length+mist)),`(${mist} lần nối sai)`),600)}
    else{mist++;$('#gm').textContent=mist;const s=sel;s.classList.remove('sel');b.classList.add('bad');s.classList.add('bad');setTimeout(()=>{b.classList.remove('bad');s.classList.remove('bad')},400);sel=null}
  });
}

/* ---------- 3. Lật thẻ ---------- */
function gMemory(root,src,fin){
  const pairs=shuffle(src.vocab).slice(0,8);let moves=0,found=0,open=[],lock=false;
  const cards=shuffle(pairs.flatMap((v,i)=>[{id:i,h:`<span class="te">${v.em}</span>`},{id:i,h:`<b>${esc(gLab(v))}</b>`}]));
  root.innerHTML=`<div class="card"><p class="muted">Số lượt lật: <b id="gm">0</b></p><div class="gtiles mem">${cards.map((c,k)=>`<button class="gtile back" data-k="${k}"><span class="face">${c.h}</span></button>`).join('')}</div></div>`;
  $$('.gtile',root).forEach(b=>b.onclick=()=>{
    if(lock||!b.classList.contains('back')||open.includes(b))return;
    b.classList.remove('back');open.push(b);
    if(open.length===2){moves++;$('#gm').textContent=moves;const [x,y]=open;const A=cards[+x.dataset.k],B=cards[+y.dataset.k];

function gLoop(root,items,fin){

}

const shortVi=v=>v.vi.split('(')[0].trim();
function vocabQuiz(words,n=10){

  pick.forEach((v,i)=>{

    if(spellOK&&i%3===2){

    }else{
      const others=shuffle(ALLVOCAB.filter(x=>shortVi(x)!==shortVi(v))).slice(0,2);
      const opts=shuffle([v,...others]);
      out.push({t:'mc',q:`${v.em} Từ “${v.w}” có nghĩa là gì?`,o:opts.map(shortVi),a:opts.indexOf(v),
        e:`<b>${esc(v.w)}</b> = <b>${esc(v.vi)}</b>.<br>Ví dụ: <i>${esc(v.ex)}</i>`,
        w:opts.map(x=>x===v?null:`“${esc(shortVi(x))}” là nghĩa của <b>${esc(x.w)}</b>, không phải của ${esc(v.w)}.`)});

  const answers={};
  function paint(){
    root.innerHTML=`<div class="quiz">
      ${opt.header||''}
      <div class="qprog"><div class="bar"><i style="width:0%"></i></div><span>Đã trả lời <b id="qc">0</b>/${items.length}</span></div>
      ${items.map((it,i)=>qHTML(it,i)).join('')}
      <div class="submitrow"><button class="btn big" id="submit">Nộp bài & chấm điểm ✔</button></div>
    </div>`;
    $$('input',root).forEach(inp=>inp.addEventListener('input',onInput));
    $('#submit',root).onclick=grade;
    function onInput(e){
      const i=+e.target.dataset.i;
      if(e.target.type==='radio'){answers[i]=+e.target.value}else{answers[i]=e.target.value.trim()===''?undefined:e.target.value}
      const c=Object.keys(answers).filter(k=>answers[k]!==undefined).length;
      $('#qc',root).textContent=c;$('.bar i',root).style.width=(100*c/items.length)+'%';
    }
  }
  function qHTML(it,i){
    const q=it.q;
    if(q.t==='mc'){
      return `<div class="qcard" id="q${i}"><div class="qn">${i+1}</div><div class="qb"><p class="qt">${esc(q.q)}</p>
      <div class="opts">${it.ord.map((oi,p)=>`<label class="opt"><input type="radio" name="q${i}" data-i="${i}" value="${oi}"><span class="ol">${L[p]}</span><span>${esc(q.o[oi])}</span></label>`).join('')}</div></div></div>`;
    }
    return `<div class="qcard" id="q${i}"><div class="qn">${i+1}</div><div class="qb"><p class="qt">${esc(q.q)}</p>
      <input class="fill" type="text" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án của bạn…"></div></div>`;
  }
  function checkFill(q,val){
    const v=norm(val||'');
    const acc=q.a.map(norm);
    if(acc.includes(v))return {ok:true};
    // near miss
    const best=acc.map(a=>({a,d:lev(v,a)})).sort((x,y)=>x.d-y.d)[0];
    const hint=Object.keys(q.h||{}).find(k=>norm(k)===v);
    return {ok:false,hint:hint?q.h[hint]:null,near:!hint&&v&&best.a.length>=4&&best.d===1};
  }
  function grade(){
    const unanswered=items.filter((_,i)=>answers[i]===undefined).length;
    if(unanswered&&!root._confirmed){
      const b=$('#submit',root);b.textContent=`Còn ${unanswered} câu chưa làm — bấm lần nữa để nộp bài`;root._confirmed=true;return;
    }
    root._confirmed=false;
    let score=0;const wrong=[];
    items.forEach((it,i)=>{
      const q=it.q,card=$('#q'+i,root);let ok=false,fb='';
      const a=answers[i];
      $$('input',card).forEach(x=>x.disabled=true);
      if(q.t==='mc'){
        ok=a===q.a;
        $$('.opt',card).forEach(lab=>{
          const v=+lab.querySelector('input').value;
          if(v===q.a)lab.classList.add('right');
          if(a===v&&!ok)lab.classList.add('wrong');
        });
        if(ok){fb=`<div class="fb ok"><b>✔ Chính xác!</b><div class="ex">${q.e}</div></div>`}
        else if(a===undefined){fb=`<div class="fb bad"><b>⚠ Bạn chưa chọn đáp án.</b><div>Đáp án đúng: <b>${esc(q.o[q.a])}</b></div><div class="ex">${q.e}</div></div>`}
        else{
          const why=q.w&&q.w[a];
          fb=`<div class="fb bad"><b>✘ Chưa đúng.</b>
          <div class="line"><span class="tag bad">Bạn chọn</span> ${esc(q.o[a])}</div>
          ${why?`<div class="line"><span class="tag why">Vì sao sai</span> ${why}</div>`:''}
          <div class="line"><span class="tag good">Đáp án đúng</span> <b>${esc(q.o[q.a])}</b></div>
          <div class="line"><span class="tag exp">Giải thích</span> <span class="ex">${q.e}</span></div></div>`;
        }
      }else{
        const r=checkFill(q,a);ok=r.ok;const inp=$('input.fill',card);
        inp.classList.add(ok?'right':'wrong');
        if(ok)fb=`<div class="fb ok"><b>✔ Chính xác!</b><div class="ex">${q.e}</div></div>`;
        else if(a===undefined)fb=`<div class="fb bad"><b>⚠ Bạn chưa điền.</b><div>Đáp án đúng: <b>${esc(q.a[0])}</b></div><div class="ex">${q.e}</div></div>`;
        else fb=`<div class="fb bad"><b>✘ Chưa đúng.</b>
          <div class="line"><span class="tag bad">Bạn viết</span> ${esc(a)}</div>
          ${r.hint?`<div class="line"><span class="tag why">Vì sao sai</span> ${r.hint}</div>`:''}
          ${r.near?`<div class="line"><span class="tag why">Gần đúng!</span> Bạn sai <b>chính tả</b> 1 chữ cái — kiểm tra lại từng chữ nhé.</div>`:''}
          <div class="line"><span class="tag good">Đáp án đúng</span> <b>${esc(q.a[0])}</b>${q.a.length>1?` <small>(cũng chấp nhận: ${q.a.slice(1).map(esc).join(' · ')})</small>`:''}</div>
          <div class="line"><span class="tag exp">Giải thích</span> <span class="ex">${q.e}</span></div></div>`;
      }
      card.classList.add(ok?'is-ok':'is-bad');
      card.querySelector('.qb').insertAdjacentHTML('beforeend',fb);
      if(ok)score++;else wrong.push(i);
      if(q.key){if(ok)delete S.miss[q.key];else S.miss[q.key]=1}
    });
    save();
    const pct=Math.round(100*score/items.length);
    const msg=pct===100?'Hoàn hảo! 🎉':pct>=80?'Rất tốt! 👏':pct>=60?'Khá ổn, ôn lại chỗ sai nhé 💪':'Đừng nản — đọc kỹ giải thích rồi làm lại nhé 🌱';
    const sum=document.createElement('div');sum.className='result';
    sum.innerHTML=`<div class="ring" style="--p:${pct}"><b>${score}/${items.length}</b><small>${pct}%</small></div>
      <div><h3>${msg}</h3>
      <p>${wrong.length?`Câu sai: ${wrong.map(i=>`<a href="#q${i}" data-jump="${i}">${i+1}</a>`).join(', ')}. Mở từng câu bên dưới để xem <b>vì sao sai</b> và <b>giải thích</b>.`:'Bạn trả lời đúng tất cả các câu!'}</p>
      <div class="btnrow">${wrong.length?'<button class="btn" id="redoWrong">Làm lại các câu sai</button>':''}<button class="btn ghost" id="redoAll">Làm lại toàn bộ</button>${opt.extraBtns||''}</div></div>`;
    root.querySelector('.quiz').prepend(sum);
    $('.submitrow',root).remove();
    $$('[data-jump]',sum).forEach(a=>a.onclick=e=>{e.preventDefault();$('#q'+a.dataset.jump,root).scrollIntoView({behavior:'smooth',block:'center'})});
    const rw=$('#redoWrong',sum);if(rw)rw.onclick=()=>{items=wrong.map(i=>items[i]);resetAns();paint();root.scrollIntoView({behavior:'smooth'})};
    $('#redoAll',sum).onclick=()=>{items=qs.map(q=>({q,ord:q.t==='mc'?(shuffleOpts?shuffle(q.o.map((_,i)=>i)):q.o.map((_,i)=>i)):null}));resetAns();paint();root.scrollIntoView({behavior:'smooth'})};
    sum.scrollIntoView({behavior:'smooth',block:'start'});
    if(opt.onDone)opt.onDone({score,total:items.length,pct,wrong:wrong.length});
    if(opt.bindExtra)opt.bindExtra(sum);
  }
  function resetAns(){for(const k in answers)delete answers[k]}
  paint();
}

function pad(n){return String(n).padStart(2,'0')}
function todayKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dayIndex(d=new Date()){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function streak(){
  const set=new Set(S.days);let n=0;const d=new Date();

    $$('.know',body).forEach(b=>b.onclick=()=>{S.known[b.dataset.k]=!S.known[b.dataset.k];save();b.textContent=S.known[b.dataset.k]?'✓ Đã thuộc':'○ Chưa thuộc';b.parentNode.classList.toggle('known',!!S.known[b.dataset.k]);renderNav()});

function drawFC(body){
  const fc=st.fc;if(!fc.list.length){body.innerHTML='<p class="empty">Không có từ nào.</p>';return}

    <div class="btnrow c"><button class="btn ghost" id="fprev">◀</button><button class="btn ghost" data-say="${esc(v.w)}">🔊 Nghe</button><button class="btn ${S.known[k]?'':'ghost'}" id="fknow">${S.known[k]?'✓ Đã thuộc':'Đánh dấu đã thuộc'}</button><button class="btn ghost" id="fnext">▶</button></div>
    <div class="btnrow c"><button class="btn ghost sm" id="fshuf">🔀 Xáo trộn</button></div></div>`;
  $('#fc').onclick=()=>{fc.flip=!fc.flip;$('#fc').classList.toggle('flip')};
  $('#fnext').onclick=()=>{fc.i=(fc.i+1)%fc.list.length;fc.flip=false;drawFC(body)};
  $('#fprev').onclick=()=>{fc.i=(fc.i-1+fc.list.length)%fc.list.length;fc.flip=false;drawFC(body)};
  $('#fknow').onclick=()=>{S.known[k]=!S.known[k];save();renderNav();drawFC(body)};
  $('#fshuf').onclick=()=>{fc.list=shuffle(fc.list);fc.i=0;fc.flip=false;drawFC(body)};
}

  <div class="daybar"><button class="btn ghost sm" id="dprev">◀ Ngày trước</button>${isToday?'<span class="pill ok">Hôm nay</span>':'<button class="btn sm" id="dnow">Về hôm nay</button>'}<button class="btn ghost sm" id="dnext">Ngày sau ▶</button>

}

/* ----- SPEAKING ----- */
function listen(cb,err){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){err('Trình duyệt này chưa hỗ trợ nhận giọng nói. Em hãy nói to rồi so với câu mẫu nhé.');return}
  try{const r=new R();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=e=>err('Không thu được âm thanh ('+e.error+'). Có thể micro đang bị chặn — em vẫn có thể tự nói rồi so với câu mẫu.');r.start()}catch(x){err('Không bật được micro.')}
}
function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;return Math.round(100*(1-lev(a,b)/Math.max(a.length,b.length)))}
function spkChk(model,heard){const m=norm(model).split(' '),h=new Set(norm(heard).split(' '));const miss=m.filter(w=>!h.has(w));const pct=Math.round(100*(m.length-miss.length)/m.length);return {pct,miss}}
function spkRow(model,label){return `<div class="spkrow"><button class="spk" data-say="${esc(model)}">🔊</button><div class="spkt"><span class="model">${esc(model)}</span>${label?`<small>${esc(label)}</small>`:''}</div><button class="mic" data-model="${esc(model)}" title="Nói thử vào micro">🎙️</button><div class="mres"></div></div>`}
function bindMic(root){
  $$('.mic',root).forEach(b=>b.onclick=()=>{const res=b.parentNode.querySelector('.mres');res.textContent='🎧 Đang nghe… hãy nói!';
    listen(t=>{const c=spkChk(b.dataset.model,t);res.innerHTML=`Em nói: “<i>${esc(t)}</i>” → <b>${c.pct}%</b> khớp${c.pct>=80?' 🎉 Rất tốt!':c.pct>=50?' 👍 Khá ổn, nói lại cho rõ hơn.':' 💪 Nghe lại câu mẫu rồi thử lần nữa.'}${c.miss.length?`<br><small>Từ chưa nghe thấy: ${c.miss.map(esc).join(', ')}</small>`:''}`;},m=>{res.innerHTML=`<small>${esc(m)}</small>`})});
}
const pic=(items,cls='')=>`<div class="pic ${cls}">${items.map(i=>`<div class="pit"><span>${i[0]}</span><small>${esc(i[1])}</small></div>`).join('')}</div>`;

    <h2 class="sec">Mở đầu bài thi</h2><div class="card">${SPK.greet.map(g=>spkRow(g.a,'Giám khảo hỏi: '+g.q)).join('')}<div class="btnrow"><button class="btn ghost sm" data-say="Hello. What's your name? How old are you?">🔊 Nghe giám khảo hỏi</button></div></div>

  if(st.sp==='p1'){
    const set=SPK.p1[st.spi%SPK.p1.length];
    m.innerHTML=`<div class="pagehead"><h1>🔍 Part 1 — Find the differences</h1><p>Giám khảo nói về <b>tranh A</b>. Em nói điểm khác ở <b>tranh B</b> của em, bắt đầu bằng “In my picture, …”.</p><div class="btnrow">${back}<button class="btn sm" id="nx">Bộ tranh khác ▶</button></div></div>
    <div class="seg">${SPK.p1.map((x,i)=>`<button class="${i===st.spi%SPK.p1.length?'on':''}" data-i="${i}">${esc(x.title)}</button>`).join('')}</div>
    <div class="two"><div class="card"><h3>Tranh A (giám khảo)</h3>${set.A.map(r=>pic(r)).join('')}</div><div class="card"><h3>Tranh B (của em)</h3>${set.B.map(r=>pic(r)).join('')}</div></div>
    <h2 class="sec">Luyện nói từng điểm khác</h2><div class="card">${set.diffs.map((d,i)=>`<div class="diff"><div class="dtop"><b>${i+1}.</b> Giám khảo: <i>${esc(d[0])}</i> <button class="spk" data-say="${esc(d[0])}">🔊</button> <small class="tag">${esc(d[2])}</small></div><div class="dmine">Em nói: <button class="btn ghost sm rv">Xem câu mẫu</button><span class="hidden">${spkRow(d[1])}</span></div></div>`).join('')}</div>
    <div class="card muted">Mẹo: nhìn từng nhóm: thời tiết, số lượng, màu sắc, vị trí, hành động, quần áo.</div>`;
    $$('.seg button').forEach(b=>b.onclick=()=>{st.spi=+b.dataset.i;vSpeaking()});$('#nx').onclick=()=>{st.spi++;vSpeaking()};
    $$('.rv').forEach(b=>b.onclick=()=>{b.nextSibling.classList.remove('hidden');b.remove();bindMic(m)});bindBack();return;
  }
  if(st.sp==='p2'){
    const set=SPK.p2[st.spi%SPK.p2.length];
    m.innerHTML=`<div class="pagehead"><h1>📖 Part 2 — Picture story</h1><p>Giám khảo kể tranh 1. Em kể tiếp tranh 2, 3, 4.</p><div class="btnrow">${back}<button class="btn sm" id="nx">Câu chuyện khác ▶</button></div></div>
    <div class="seg">${SPK.p2.map((x,i)=>`<button class="${i===st.spi%SPK.p2.length?'on':''}" data-i="${i}">${esc(x.title)}</button>`).join('')}</div>
    <div class="story">${set.pics.map((p,i)=>`<div class="card"><h3>Tranh ${i+1}</h3>${pic(p)}</div>`).join('')}</div>
    <div class="card"><b>Giám khảo:</b> ${esc(set.start)} <button class="spk" data-say="${esc(set.start)}">🔊</button><br><b>Từ nối:</b> ${SPK.link.map(w=>`<span class="chipx">${w}</span>`).join(' ')}</div>
    <h2 class="sec">Kể chuyện mẫu</h2><div class="card"><button class="btn ghost sm rv">Xem bài kể mẫu</button><div class="hidden">${set.model.slice(1).map((t,i)=>spkRow(t,'Tranh '+(i+2))).join('')}<button class="btn sm" id="sayall">🔊 Nghe cả câu chuyện</button></div></div>`;
    $$('.seg button').forEach(b=>b.onclick=()=>{st.spi=+b.dataset.i;vSpeaking()});$('#nx').onclick=()=>{st.spi++;vSpeaking()};
    $$('.rv').forEach(b=>b.onclick=()=>{b.nextSibling.classList.remove('hidden');b.remove();bindMic(m);$('#sayall').onclick=()=>sayQueue(set.model)});bindBack();return;
  }
  if(st.sp==='p3'){
    const set=SPK.p3[st.spi%SPK.p3.length];
    m.innerHTML=`<div class="pagehead"><h1>🧩 Part 3 — Odd one out</h1><p>Chọn tranh khác loại, rồi nói: “… is different because …”.</p><div class="btnrow">${back}<button class="btn sm" id="nx">Nhóm khác ▶</button></div></div>
    <div class="card"><div class="pic odd">${set.items.map((it,i)=>`<button class="pit pick" data-i="${i}"><span>${it[0]}</span><small>${esc(it[1])}</small></button>`).join('')}</div><div id="r"></div></div>`;
    $('#nx').onclick=()=>{st.spi++;vSpeaking()};
    $$('.pick').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const ok=i===set.odd||(set.alt||[]).some(a=>a[0]===i);const reason=i===set.odd?set.reason:((set.alt||[]).find(a=>a[0]===i)||[])[1];
      $('#r').innerHTML=ok?`<p class="okmsg">✅ Đúng! ${spkRow(reason)}</p>`:`<p class="badmsg">❌ Chưa đúng. Tìm điểm chung của 3 tranh còn lại rồi thử lại.</p><div class="spkrow"><small>Gợi ý đáp án:</small></div>${spkRow(set.reason)}`;
      bindMic($('#r'))});bindBack();return;
  }
  if(st.sp==='p4'){
    m.innerHTML=`<div class="pagehead"><h1>💬 Part 4 — Personal questions</h1><p>Nghe câu hỏi (🔊), trả lời bằng 1–2 câu, rồi so với câu mẫu.</p><div class="btnrow">${back}<button class="btn sm" id="rnd">🎲 Hỏi ngẫu nhiên</button></div></div>
    ${SPK.p4.map(t=>`<h2 class="sec">${t.icon} ${t.topic}</h2><div class="card">${t.qa.map(q=>`<div class="diff"><div class="dtop"><button class="spk" data-say="${esc(q[0])}">🔊</button> <b>${esc(q[0])}</b></div><div class="dmine"><button class="btn ghost sm rv">Xem câu trả lời mẫu</button><span class="hidden">${spkRow(q[1])}</span></div></div>`).join('')}</div>`).join('')}`;
    $$('.rv').forEach(b=>b.onclick=()=>{b.nextSibling.classList.remove('hidden');b.remove();bindMic(m)});
    $('#rnd').onclick=()=>{const all=SPK.p4.flatMap(t=>t.qa);const q=all[Math.floor(Math.random()*all.length)];say(q[0]);m.insertAdjacentHTML('afterbegin',`<div class="card toast">🎲 Câu hỏi: <b>${esc(q[0])}</b><br>${spkRow(q[1],'Câu mẫu')}</div>`);bindMic(m);window.scrollTo(0,0)};
    bindBack();return;
  }
}

/* ----- WORKSHEETS ----- */
function vWorksheets(){
  if(!st.wsid){
    main().innerHTML=`<div class="pagehead"><h1>📄 Beacon Movers Worksheet — Set 3</h1><p>Chuyển từ file Word của bạn thành bài làm trực tiếp, chấm theo đúng <b>Answer Key</b>.</p></div>
    <div class="ugrid">${WS.map(w=>`<article class="ucard" style="--h:${hue(w.id+3)}"><div class="uhead"><span class="uic">${w.icon}</span><span class="un">Worksheet ${w.id}</span></div><h3>${w.title}</h3><small>${w.skill}</small><br><small>${w.qs.length} câu${S.ws[w.id]!=null?` · Cao nhất ${S.ws[w.id]}%`:''}</small><div class="ulinks"><a data-w="${w.id}">Làm bài ▶</a></div></article>`).join('')}</div>`;
    $$('[data-w]').forEach(a=>a.onclick=()=>{st.wsid=+a.dataset.w;vWorksheets();window.scrollTo(0,0)});return;
  }
  const w=WS.find(x=>x.id===st.wsid);
  main().innerHTML=`<div class="pagehead"><h1>${w.icon} Worksheet ${w.id}: ${w.title}</h1><p><i>${w.skill}</i></p><div class="btnrow"><button class="btn ghost sm" id="wback">◀ Danh sách worksheet</button></div></div>
  <div class="card instr"><p>${w.intro}</p></div>
  ${w.text?`<div class="card passage">${w.text}</div>`:''}
  ${w.img?`<div class="card pic"><img alt="Tranh công viên: nhiều người đang chơi, vẽ, chụp ảnh, đọc sách" src="${IMG.ws7}"></div>`:''}
  <div id="qroot"></div>
  ${w.open?`<div id="openbox" class="card"><h3>✍️ Viết câu về bức tranh (tự đánh giá)</h3>${w.open.map((o,i)=>`<label class="openq"><b>${o.q}</b><textarea rows="2" placeholder="Viết câu của bạn…"></textarea></label>`).join('')}<button class="btn ghost" id="showModel">Xem câu mẫu</button><div id="models" class="hidden">${w.open.map(o=>`<p class="model"><b>Câu mẫu:</b> ${esc(o.model)}</p>`).join('')}<p class="small">Mẹo: câu hay thường có chủ ngữ + động từ (is reading / is riding) + vị trí (under the tree, next to...). Có nhiều đáp án hợp lý khác — answer key cho phép “any other reasonable answers”.</p></div></div>`:''}`;
  $('#wback').onclick=()=>{st.wsid=null;vWorksheets()};
  if($('#showModel'))$('#showModel').onclick=()=>$('#models').classList.remove('hidden');
  runQuiz($('#qroot'),w.qs,{shuffle:false,onDone:r=>{S.ws[w.id]=Math.max(S.ws[w.id]||0,r.pct);save()}});
}

/* ----- PROGRESS ----- */
function vProgress(){
  const known=Object.keys(S.known).filter(k=>S.known[k]).length;const missN=Object.keys(S.miss).length;
  main().innerHTML=`<div class="pagehead"><h1>📈 Tiến độ học tập</h1><p>Dữ liệu được lưu trên trình duyệt của bạn.</p></div>
  <div class="statrow"><div class="stat"><b>${known}</b><span>từ đã thuộc</span></div><div class="stat"><b>${streak()}</b><span>ngày liên tiếp</span></div><div class="stat"><b>${S.days.length}</b><span>ngày đã học</span></div><div class="stat"><b>${missN}</b><span>câu trong sổ lỗi sai</span></div></div>
  <h2 class="sec">Theo từng Unit</h2>
  <div class="ptable">${UNITS.map(u=>{const k=unitKnown(u),sc=unitScore(u);return `<div class="prow" style="--h:${hue(u.id)}"><div class="pl">${u.icon} <b>Unit ${u.id}</b> <span>${u.title}</span></div>
    <div class="pm"><small>Từ vựng ${k}/${u.vocab.length}</small><div class="meter"><i style="width:${100*k/u.vocab.length}%"></i></div></div>
    <div class="pm"><small>Bài tập ${sc!=null?sc+'%':'—'}</small><div class="meter"><i style="width:${sc||0}%"></i></div></div></div>`}).join('')}</div>
  <h2 class="sec">Sách Grammar for Movers</h2>
  <div class="ptable">${BOOKS.flatMap(b=>b.lessons.map(l=>{const sc=l.exercises.map((_,ei)=>S.bk[`${b.id}-${l.n}-${ei}`]).filter(x=>x!=null);const avg=sc.length?Math.round(sc.reduce((a,c)=>a+c,0)/sc.length):0;return `<div class="prow" style="--h:${(b.color+l.n*17)%360}"><div class="pl">${l.icon} <b>${b.short} · L${l.n}</b> <span>${l.title}</span></div><div class="pm"><small>${sc.length}/${l.exercises.length} bài · TB ${sc.length?avg+'%':'—'}</small><div class="meter"><i style="width:${avg}%"></i></div></div><div></div></div>`})).join('')}</div>
  <h2 class="sec">Worksheet Set 3</h2>
  <div class="ptable">${WS.map(w=>`<div class="prow" style="--h:${hue(w.id+3)}"><div class="pl">${w.icon} <b>WS ${w.id}</b> <span>${w.title}</span></div><div class="pm"><small>Cao nhất ${S.ws[w.id]!=null?S.ws[w.id]+'%':'—'}</small><div class="meter"><i style="width:${S.ws[w.id]||0}%"></i></div></div><div></div></div>`).join('')}</div>
  <div class="btnrow" style="margin-top:20px"><button class="btn" id="pmiss">📓 Luyện sổ lỗi sai (${missN})</button><button class="btn ghost danger" id="preset">Xóa toàn bộ tiến độ</button></div>`;
  $('#pmiss').onclick=()=>{if(!missN){return}st.pu='miss';go('practice')};
  $('#preset').onclick=function(){if(this.dataset.c){S={known:{},scores:{},ws:{},days:[],miss:{},bk:{},gm:{},spk:{},voice:'',rate:.85};save();render()}else{this.dataset.c=1;this.textContent='Bấm lần nữa để xác nhận xóa'}};
}

/* ---------- boot ---------- */
(function(){
  const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))st.view=h;
  render();
})();

</script>
</body>
</html>
